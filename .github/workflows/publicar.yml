# Publica los artículos programados del blog.
# Todos los días a las 06:15 UTC (08:15 en Madrid en verano, 07:15 en invierno):
#   1. Pide a Vercel que vuelva a compilar la web. Los artículos cuya fecha (pubDate) ya llegó aparecen.
#   2. Espera a que termine el deploy.
#   3. Avisa a Bing (IndexNow) de los artículos publicados en las últimas 24 horas.
# Necesita el secreto VERCEL_DEPLOY_HOOK (Settings > Secrets and variables > Actions).
name: Publicar artículos programados

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Volver a compilar la web en Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Falta el secreto VERCEL_DEPLOY_HOOK"; exit 1; fi
          curl -fsS -X POST "$HOOK"

      - name: Esperar a que termine el deploy
        run: sleep 240

      - name: Avisar a Bing de los artículos nuevos (IndexNow)
        run: |
          python3 - <<'PY'
          import json, urllib.request, email.utils, datetime
          SITE = "https://www.emilianomoretti.com"
          KEY = "4b8b80a693d07c7131de46a294bd6889"
          rss = urllib.request.urlopen(SITE + "/rss.xml").read().decode("utf-8")
          import xml.etree.ElementTree as ET
          now = datetime.datetime.now(datetime.timezone.utc)
          urls = []
          for item in ET.fromstring(rss).iter("item"):
              when = email.utils.parsedate_to_datetime(item.findtext("pubDate"))
              if now - when <= datetime.timedelta(hours=24):
                  urls.append(item.findtext("link"))
          if not urls:
              print("Hoy no hay artículos nuevos.")
              raise SystemExit(0)
          urls += [SITE + "/", SITE + "/blog/"]
          body = json.dumps({"host": "www.emilianomoretti.com", "key": KEY,
                             "keyLocation": f"{SITE}/{KEY}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          print(urllib.request.urlopen(req).status, urls)
          PY
